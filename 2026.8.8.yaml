# 必读！！！
# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
# 跑裸核用户请自行去掉下方控制面板模块的注释。
# 机场订阅
proxy-providers:
  花云:
    url: "订阅"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: "花云 | "
    proxy: DIRECT
  赔钱:
    url: "订阅"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: "赔钱 | "
    proxy: DIRECT
  良心:
    url: "订阅"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: "良心 | "
    proxy: DIRECT
    #override:
      #additional-prefix: "前缀 |"
      #additional-suffix: "| 后缀"
# 节点信息


# 全局配置 
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
# interface-name: en0
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true

# 控制面板，external-ui 路径如果出现报错，根据你使用的插件进行调整，比如openclash改为： /etc/openclash/run  ，裸核跑改为/etc/mihomo/run
# 因容易造成新手面板启动问题，我注释掉了，需要的自行开启
#external-controller: 0.0.0.0:9090
#secret: ""
#external-ui: "/etc/nikki/run"
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"

# 入站  
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true


 
# 出站策略 select参数 （ uselightgbm: false, collectdata: false, strategy: sticky-sessions,policy-priority: "Premium:0.9;SG:1.3" ）
proxy-groups:
  - {name: 🚀 节点选择, type: select, proxies: [🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, ♻️ 自动选择, 🛜 低倍率, 🌐 全部节点, DIRECT]}
  - {name: 📹 YouTube, type: select, proxies: [🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, ♻️ 自动选择, 🛜 低倍率, 🌐 全部节点, DIRECT]}
  - {name: 🎵 Spotify, type: select, proxies: [🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, ♻️ 自动选择, 🛜 低倍率, 🌐 全部节点, DIRECT]}  
  - {name: 🎵 TikTok, type: select, proxies: [🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, ♻️ 自动选择, 🛜 低倍率, 🌐 全部节点, DIRECT]}  
  - {name: 🤖 AI, type: select, proxies: [🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, ♻️ 自动选择, 🛜 低倍率, 🌐 全部节点, DIRECT]}
  - {name: 🪟 Microsoft, type: select, proxies: [🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, ♻️ 自动选择, 🛜 低倍率, 🌐 全部节点, DIRECT]}
  - {name: 🍎 Apple, type: select, proxies: [🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, ♻️ 自动选择, 🛜 低倍率, 🌐 全部节点, DIRECT]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, ♻️ 自动选择, 🛜 低倍率, 🌐 全部节点, DIRECT]}
  - {name: 🇭🇰 香港节点, type: select, proxies: [♻️ 主力香港, ♻️ 备用香港]}
  - {name: 🇨🇳 台湾节点, type: select, proxies: [♻️ 主力台湾, ♻️ 备用台湾]}
  - {name: 🇯🇵 日本节点, type: select, proxies: [♻️ 主力日本, ♻️ 备用日本]}
  - {name: 🇸🇬 狮城节点, type: select, proxies: [♻️ 主力狮城, ♻️ 备用狮城]}
  - {name: 🇺🇲 美国节点, type: select, proxies: [♻️ 主力美国, ♻️ 备用美国]}
  - {name: 🛜 低倍率, type: select, proxies: [♻️ 主力低倍率, ♻️ 备用低倍率]}
  - {name: ♻️ 主力香港, type: select,  include-all: true,  filter: "(?=.*(花云))(?=.*(港|HK|(?i)Hong))"}
  - {name: ♻️ 主力台湾, type: select,  include-all: true,  filter: "(?=.*(花云))(?=.*(台|新北|彰化|TW|(?i)Taiwan))"}
  - {name: ♻️ 主力日本, type: select,  include-all: true,  filter: "(?=.*(花云))(?=.*(日|JP|(?i)Japan))" }
  - {name: ♻️ 主力狮城, type: select,  include-all: true,  filter: "(?=.*(花云))(?=.*(新加坡|坡|狮城|SG|Singapore))" }
  - {name: ♻️ 主力美国, type: select,  include-all: true,  filter: "(?=.*(花云))(?=.*(美|US|(?i)States|America))"}
  - {name: ♻️ 备用香港, type: select,  include-all: true,  filter: "(?=.*(赔钱|良心))(?=.*(港|HKG|(?i)Hong))"}
  - {name: ♻️ 备用台湾, type: select,  include-all: true,  filter: "(?=.*(赔钱|良心))(?=.*(台|新北|彰化|TWN|(?i)Taiwan))"}
  - {name: ♻️ 备用日本, type: select,  include-all: true,  filter: "(?=.*(赔钱|良心))(?=.*(日|JPN|(?i)Japan))^((?!(港|台|韩|新|美)).)*$" }
  - {name: ♻️ 备用狮城, type: select,  include-all: true,  filter: "(?=.*(赔钱|良心))(?=.*(新加坡|坡|狮城|SGP|Singapore))" }
  - {name: ♻️ 备用美国, type: select,  include-all: true,  filter: "(?=.*(赔钱|良心))(?=.*(美|USA|(?i)States|America))"}
  - {name: ♻️ 主力低倍率, type: select,  include-all: true,  filter: "花云.*(低倍率|实验性|0.01|0.1|0.2|0.3|0.5)"}
  - {name: ♻️ 备用低倍率, type: select,  include-all: true,  filter: "(?=.*(赔钱|良心))(?=.*(低倍率|实验性|0.01|0.1|0.2|0.3|0.5))"}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 300}
  - {name: 🌐 全部节点, type: select, include-all: true}

# 规则匹配
# 此规则部分没有做防泄露处理，因为弊严重大于利！
rules:
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,🚀 节点选择
  - DOMAIN-SUFFIX,services.googleapis.cn,🚀 节点选择
  - RULE-SET,GoogleCNProxyIP,🚀 节点选择
  - RULE-SET,emby,🛜 低倍率
  - RULE-SET,pikpak,🛜 低倍率
  - RULE-SET,apple,🍎 Apple
  - RULE-SET,chatgpt,🤖 AI
  - RULE-SET,gemini,🤖 AI 
  - RULE-SET,Spotify,🎵 Spotify
  - RULE-SET,XiaoMi,DIRECT
  - RULE-SET,WeChat,DIRECT
  - RULE-SET,cnemby,DIRECT
  - RULE-SET,UnBan,DIRECT
  - RULE-SET,Download,DIRECT
  - RULE-SET,ChinaMax,DIRECT
